<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Éire Metrics LIVE
  </title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-[#020617] text-white min-h-screen">

  <div class="max-w-6xl mx-auto p-8">

    <!-- HEADER -->

    <div class="text-center mb-10">

      <h1 class="text-5xl font-bold mb-2">
        Éire Metrics LIVE
      </h1>

      <p class="text-slate-400">
        Real-Time Match Analytics
      </p>

    </div>

    <!-- SCOREBOARD -->

    <div class="bg-slate-900 rounded-3xl p-8 border border-slate-800 mb-8">

      <div class="flex justify-between items-center mb-6">

        <div>

          <h2
            id="matchTitle"
            class="text-4xl font-bold"
          >
            Loading Match...
          </h2>

          <p
            id="competition"
            class="text-slate-400"
          >
            Competition
          </p>

        </div>

        <div class="bg-red-500 px-4 py-2 rounded-full text-sm font-bold animate-pulse">
          LIVE
        </div>

      </div>

      <div class="grid grid-cols-2 gap-6">

        <!-- HOME -->

        <div class="bg-slate-800 rounded-2xl p-8 text-center">

          <p
            id="homeTeam"
            class="text-slate-300 text-xl mb-3"
          >
            Home
          </p>

          <h2
            id="homeScore"
            class="text-6xl font-bold text-emerald-400"
          >
            0-00
          </h2>

        </div>

        <!-- AWAY -->

        <div class="bg-slate-800 rounded-2xl p-8 text-center">

          <p
            id="awayTeam"
            class="text-slate-300 text-xl mb-3"
          >
            Away
          </p>

          <h2
            id="awayScore"
            class="text-6xl font-bold text-red-400"
          >
            0-00
          </h2>

        </div>

      </div>

    </div>

    <!-- ANALYTICS -->

    <div class="grid grid-cols-3 gap-6 mb-8">

      <!-- SHOTS -->

      <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 text-center">

        <p class="text-slate-400 mb-2">
          Shots
        </p>

        <h2
          id="shots"
          class="text-5xl font-bold"
        >
          0
        </h2>

      </div>

      <!-- CONVERSION -->

      <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 text-center">

        <p class="text-slate-400 mb-2">
          Conversion
        </p>

        <h2
          id="conversion"
          class="text-5xl font-bold"
        >
          0%
        </h2>

      </div>

      <!-- 2 POINTERS -->

      <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 text-center">

        <p class="text-slate-400 mb-2">
          2 Pointers
        </p>

        <h2
          id="twoPointers"
          class="text-5xl font-bold"
        >
          0
        </h2>

      </div>

    </div>

    <!-- MOMENTUM GRAPH -->

    <div class="bg-slate-900 rounded-3xl p-8 border border-slate-800 mb-8">

      <h2 class="text-3xl font-bold mb-6">
        Live Momentum
      </h2>

      <canvas id="momentumChart"></canvas>

    </div>

    <!-- POSSESSION -->

    <div class="bg-slate-900 rounded-3xl p-8 border border-slate-800 mb-8">

      <div class="flex items-center justify-between mb-6">

        <h2 class="text-3xl font-bold">
          Possession
        </h2>

        <div class="text-slate-400">
          Match Control
        </div>

      </div>

      <div class="flex justify-between mb-4">

        <div>

          <h2
            id="homePossession"
            class="text-5xl font-bold text-emerald-400"
          >
            50%
          </h2>

          <p class="text-slate-400 mt-1">
            Home
          </p>

        </div>

        <div class="text-right">

          <h2
            id="awayPossession"
            class="text-5xl font-bold text-red-400"
          >
            50%
          </h2>

          <p class="text-slate-400 mt-1">
            Away
          </p>

        </div>

      </div>

      <!-- BAR -->

      <div class="w-full h-8 bg-slate-800 rounded-full overflow-hidden flex">

        <div
          id="homeBar"
          class="bg-emerald-500 transition-all duration-500"
          style="width:50%"
        ></div>

        <div
          id="awayBar"
          class="bg-red-500 transition-all duration-500"
          style="width:50%"
        ></div>

      </div>

    </div>

    <!-- SHOT MAP -->

    <div class="bg-slate-900 rounded-3xl p-8 border border-slate-800">

      <h2 class="text-3xl font-bold mb-6">
        Live Shot Map
      </h2>

      <div class="relative w-fit mx-auto">

        <!-- PITCH -->

        <img
          src="shotmap.png"
          class="rounded-2xl w-[700px]"
        />

        <!-- SHOTS -->

        <div
          id="shotContainer"
          class="absolute inset-0"
        ></div>

      </div>

    </div>

  </div>

  <script>

    const supabaseUrl =
      'https://nftqvzvzlstfjbanqprp.supabase.co'

    const supabaseKey =
      'PASTE_YOUR_PUBLISHABLE_KEY'

    const client =
      supabase.createClient(
        supabaseUrl,
        supabaseKey
      )

    const MATCH_ID = 5

    let momentumChart

    async function loadMatch() {

      const { data } = await client
        .from('matches')
        .select('*')
        .eq('id', MATCH_ID)
        .single()

      if (!data) return

      document.getElementById('matchTitle').innerText =
        `${data.team_name} vs ${data.opponent}`

      document.getElementById('homeTeam').innerText =
        data.team_name

      document.getElementById('awayTeam').innerText =
        data.opponent

      document.getElementById('competition').innerText =
        data.competition

    }

    async function loadEvents() {

      const { data } = await client
        .from('events')
        .select('*')
        .eq('match_id', MATCH_ID)
        .order('created_at', { ascending: true })

      if (!data) return

      // HOME

      let homePoints = 0
      let homeGoals = 0

      // AWAY

      let awayPoints = 0
      let awayGoals = 0

      // OTHER

      let wides = 0
      let twoPointers = 0

      // POSSESSION

      let homePossessionEvents = 0
      let awayPossessionEvents = 0

      // GRAPH

      let momentumData = []
      let labels = []

      // SHOT MAP

      const shotContainer =
        document.getElementById('shotContainer')

      shotContainer.innerHTML = ''

      data.forEach((event, index) => {

        // HOME

        if (event.event_type === 'our_point') {
          homePoints += 1
        }

        if (event.event_type === 'our_goal') {
          homeGoals += 1
        }

        // AWAY

        if (event.event_type === 'opp_point') {
          awayPoints += 1
        }

        if (event.event_type === 'opp_goal') {
          awayGoals += 1
        }

        // MISSES

        if (event.event_type === 'wide') {
          wides += 1
        }

        // 2 POINTERS

        if (event.is_two_pointer) {
          twoPointers += 1
        }

        // POSSESSION

        if (event.event_type === 'possession_won') {
          homePossessionEvents += 1
        }

        if (event.event_type === 'possession_lost') {
          awayPossessionEvents += 1
        }

        // MOMENTUM

        const homeTotal =
          (homeGoals * 3) + homePoints

        const awayTotal =
          (awayGoals * 3) + awayPoints

        const differential =
          homeTotal - awayTotal

        momentumData.push(differential)

        labels.push(index + 1)

        // SHOT MAP

        if (
          event.x_location &&
          event.y_location
        ) {

          const dot =
            document.createElement('div')

          dot.className =
            'absolute w-5 h-5 rounded-full border-2 border-white'

          // GOALS

          if (
            event.event_type === 'our_goal'
          ) {

            dot.style.background =
              '#ef4444'

            dot.style.borderRadius =
              '4px'

          }

          // 2 POINTERS

          else if (
            event.is_two_pointer
          ) {

            dot.style.background =
              '#eab308'

          }

          // NORMAL SCORES

          else {

            dot.style.background =
              '#10b981'

          }

          dot.style.left =
            `${event.x_location * 2.18}px`

          dot.style.top =
            `${event.y_location * 1.4}px`

          shotContainer.appendChild(dot)

        }

      })

      // SCOREBOARD

      document.getElementById('homeScore').innerText =
        `${homeGoals}-${homePoints}`

      document.getElementById('awayScore').innerText =
        `${awayGoals}-${awayPoints}`

      // SHOTS

      const totalShots =
        homePoints +
        homeGoals +
        wides

      document.getElementById('shots').innerText =
        totalShots

      // CONVERSION

      const totalScores =
        homePoints +
        homeGoals

      const conversion =
        totalShots > 0
          ? Math.round(
              (totalScores / totalShots) * 100
            )
          : 0

      document.getElementById('conversion').innerText =
        `${conversion}%`

      // 2 POINTERS

      document.getElementById('twoPointers').innerText =
        twoPointers

      // POSSESSION %

      const totalPossessions =
        homePossessionEvents +
        awayPossessionEvents

      let homePossession = 50
      let awayPossession = 50

      if (totalPossessions > 0) {

        homePossession =
          Math.round(
            (
              homePossessionEvents /
              totalPossessions
            ) * 100
          )

        awayPossession =
          100 - homePossession

      }

      // UPDATE POSSESSION

      document.getElementById('homePossession').innerText =
        `${homePossession}%`

      document.getElementById('awayPossession').innerText =
        `${awayPossession}%`

      document.getElementById('homeBar').style.width =
        `${homePossession}%`

      document.getElementById('awayBar').style.width =
        `${awayPossession}%`

      // CHART

      const ctx =
        document.getElementById('momentumChart')

      if (momentumChart) {
        momentumChart.destroy()
      }

      momentumChart = new Chart(ctx, {

        type: 'line',

        data: {

          labels,

          datasets: [

            {

              label:
                'Score Differential',

              data:
                momentumData,

              borderColor:
                '#10b981',

              backgroundColor:
                'rgba(16,185,129,0.2)',

              tension: 0.4,

              fill: true,

              borderWidth: 4,

              pointRadius: 0

            }

          ]

        },

        options: {

          responsive: true,

          plugins: {

            legend: {

              display: true,

              labels: {

                color: '#ffffff',

                font: {
                  size: 14
                }

              }

            }

          },

          scales: {

            x: {

              ticks: {
                color: '#94a3b8'
              },

              grid: {
                color: '#1e293b'
              }

            },

            y: {

              ticks: {
                color: '#94a3b8'
              },

              grid: {
                color: '#1e293b'
              }

            }

          }

        }

      })

    }

    async function init() {

      await loadMatch()

      await loadEvents()

    }

    init()

    // REALTIME

    client
      .channel('events-live')
      .on(
        'postgres_changes',
        {
          event: '*',
          schema: 'public',
          table: 'events'
        },
        payload => {

          loadEvents()

        }
      )
      .subscribe()

  </script>

</body>
</html>
