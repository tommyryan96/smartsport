<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Éire Metrics LIVE</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {
      background: #020617;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 999px;
    }

    .live-dot {
      animation: pulseDot 1.2s infinite;
    }

    @keyframes pulseDot {

      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }

    }

  </style>

</head>

<body class="text-white">

<div class="min-h-screen p-4 md:p-8">

  <!-- HEADER -->

  <div class="mb-6">

    <div class="flex items-center gap-3 mb-2">

      <h1
        id="matchTitle"
        class="text-5xl font-bold"
      >
        Loading...
      </h1>

      <div
        id="liveBadge"
        class="flex items-center gap-2 text-sm"
      >

        <div class="w-2 h-2 bg-red-500 rounded-full live-dot"></div>

        LIVE

      </div>

    </div>

    <p
      id="competition"
      class="text-slate-400"
    >
      Competition
    </p>

    <!-- MATCH SELECTOR -->

    <div class="mt-5 max-w-md">

      <label class="block text-slate-400 mb-2">
        Historical Matches
      </label>

      <select
        id="matchSelector"
        class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3"
      >

        <option value="latest">
          🔴 Latest Live Match
        </option>

      </select>

    </div>

  </div>

  <!-- SCORE -->

  <div class="grid grid-cols-2 gap-4 mb-6">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center">

      <p
        id="homeTeam"
        class="text-slate-400 mb-2"
      >
        Home
      </p>

      <h2
        id="homeScore"
        class="text-6xl font-bold text-emerald-400"
      >
        0-00
      </h2>

    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center">

      <p
        id="awayTeam"
        class="text-slate-400 mb-2"
      >
        Away
      </p>

      <h2
        id="awayScore"
        class="text-6xl font-bold text-red-400"
      >
        0-00
      </h2>

    </div>

  </div>

  <!-- MAIN GRID -->

  <div class="grid grid-cols-1 xl:grid-cols-[1fr_400px] gap-6">

    <!-- LEFT -->

    <div class="space-y-6">

      <!-- STATS -->

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

        <div class="bg-slate-900 rounded-3xl p-4 text-center border border-slate-800">

          <p class="text-slate-400">
            Shots
          </p>

          <h2
            id="shots"
            class="text-3xl font-bold"
          >
            0
          </h2>

        </div>

        <div class="bg-slate-900 rounded-3xl p-4 text-center border border-slate-800">

          <p class="text-slate-400">
            Conversion
          </p>

          <h2
            id="conversion"
            class="text-3xl font-bold"
          >
            0%
          </h2>

        </div>

        <div class="bg-slate-900 rounded-3xl p-4 text-center border border-slate-800">

          <p class="text-slate-400">
            2PT
          </p>

          <h2
            id="twoPointers"
            class="text-3xl font-bold"
          >
            0
          </h2>

        </div>

        <div class="bg-slate-900 rounded-3xl p-4 text-center border border-slate-800">

          <p class="text-slate-400">
            Match Clock
          </p>

          <h2
            id="matchClock"
            class="text-3xl font-bold"
          >
            00:00
          </h2>

        </div>

      </div>

      <!-- POSSESSION -->

      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

        <div class="flex justify-between items-center mb-5">

          <h2 class="text-2xl font-bold">
            Possession
          </h2>

          <div class="text-sm text-slate-400">
            Estimated Live Share
          </div>

        </div>

        <div class="mb-4">

          <div class="flex justify-between mb-2">

            <span
              id="homePossessionLabel"
              class="font-semibold text-emerald-400"
            >
              Home 50%
            </span>

            <span
              id="awayPossessionLabel"
              class="font-semibold text-red-400"
            >
              Away 50%
            </span>

          </div>

          <div class="w-full h-5 bg-slate-800 rounded-full overflow-hidden">

            <div class="flex h-full">

              <div
                id="homePossessionBar"
                class="bg-emerald-500 transition-all duration-500"
                style="width:50%"
              ></div>

              <div
                id="awayPossessionBar"
                class="bg-red-500 transition-all duration-500"
                style="width:50%"
              ></div>

            </div>

          </div>

        </div>

      </div>

      <!-- MOMENTUM -->

      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

        <h2 class="text-2xl font-bold mb-5">
          Momentum
        </h2>

        <div class="h-[300px]">

          <canvas id="momentumChart"></canvas>

        </div>

      </div>

      <!-- EVENT FEED -->

      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

        <h2 class="text-2xl font-bold mb-5">
          Event Feed
        </h2>

        <div
          id="eventFeed"
          class="space-y-3 max-h-[500px] overflow-y-auto"
        ></div>

      </div>

    </div>

    <!-- RIGHT -->

    <div>

      <!-- SHOT MAP -->

      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

        <h2 class="text-2xl font-bold mb-5">
          Shot Map
        </h2>

        <div class="relative overflow-hidden rounded-2xl bg-slate-950">

          <img
            src="shotmap.png"
            class="w-full rounded-2xl block"
          />

         <div
  id="shotContainer"
  class="absolute inset-0 z-50"
></div>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

const supabaseUrl =
  'https://nftqvzvzlstfjbanqprp.supabase.co'

const supabaseKey =
  'sb_publishable_omwQ3vjOsAsLgSaTrMGGhQ_vE9qnU6r'

const client =
  supabase.createClient(
    supabaseUrl,
    supabaseKey
  )

const params =
  new URLSearchParams(window.location.search)

let MATCH_ID =
  parseInt(params.get('id'))

let momentumChart
let matchClockInterval = null

function formatEvent(type) {

  const labels = {

    our_point: 'Point',
    our_goal: 'Goal',
    opp_point: 'Opp Point',
    opp_goal: 'Opp Goal',
    wide: 'Wide',
    short: 'Short',
    turnover_won: 'Turnover Won',
    turnover_lost: 'Turnover Lost'

  }

  return labels[type] || type

}

function getEventIcon(type) {

  const icons = {

    our_goal: '🥅',
    our_point: '⚪',
    opp_goal: '🔴',
    opp_point: '🟥',
    wide: '❌',
    short: '⬛',
    turnover_won: '🟢',
    turnover_lost: '🔁'

  }

  return icons[type] || '•'

}

async function loadMatchSelector() {

  const { data } =
    await client
      .from('matches')
      .select('*')
      .order('id', {
        ascending: false
      })

  const selector =
    document.getElementById('matchSelector')

  selector.innerHTML = `
    <option value="latest">
      🔴 Latest Live Match
    </option>
  `

  data.forEach(match => {

    const option =
      document.createElement('option')

    option.value =
      match.id

    option.innerText =
      `${match.team_name} vs ${match.opponent}`

    selector.appendChild(option)

  })

  selector.addEventListener(
    'change',
    async function(e) {

      const selected =
        e.target.value

      MATCH_ID =
        selected === 'latest'
          ? null
          : parseInt(selected)

      await loadMatch()
      await loadEvents()

    }
  )

}

async function loadMatch() {

  let query =
    client
      .from('matches')
      .select('*')

  if (MATCH_ID) {

    query =
      query.eq('id', MATCH_ID)

  }

  else {

    query =
      query
        .order('id', {
          ascending: false
        })
        .limit(1)

  }

  const { data } =
    await query.single()

  if (!data) return

  if (!MATCH_ID) {
    MATCH_ID = data.id
  }

  document.getElementById('matchTitle').innerText =
    `${data.team_name} vs ${data.opponent}`

  document.getElementById('homeTeam').innerText =
    data.team_name

  document.getElementById('awayTeam').innerText =
    data.opponent

  document.getElementById('competition').innerText =
    data.competition || 'Competition'

  clearInterval(matchClockInterval)

  if (data.match_start_time) {

    matchClockInterval =
      setInterval(() => {

        const start =
          new Date(data.match_start_time)

        const now =
          new Date()

        const diff =
          Math.floor(
            (now - start) / 1000
          )

        const mins =
          String(
            Math.floor(diff / 60)
          ).padStart(2, '0')

        const secs =
          String(
            diff % 60
          ).padStart(2, '0')

        document.getElementById('matchClock').innerText =
          `${mins}:${secs}`

      }, 1000)

  }

}

async function loadEvents() {

  if (!MATCH_ID) return

  const { data } =
    await client
      .from('events')
      .select('*')
      .eq('match_id', MATCH_ID)
      .order('created_at', {
        ascending: true
      })

  const eventFeed =
    document.getElementById('eventFeed')

  const shotContainer =
    document.getElementById('shotContainer')

  eventFeed.innerHTML = ''
  shotContainer.innerHTML = ''

  if (!data || data.length === 0) return

  let homePoints = 0
  let homeGoals = 0
  let awayPoints = 0
  let awayGoals = 0
  let wides = 0
  let shorts = 0
  let twoPointers = 0

  let homePossession = 0
  let awayPossession = 0

  let momentumData = []
  let labels = []

  data.forEach((event, index) => {

    // SCORING

    if (event.event_type === 'our_point') {
      homePoints += event.is_two_pointer ? 2 : 1
      homePossession += 1
    }

    if (event.event_type === 'our_goal') {
      homeGoals += 1
      homePossession += 1
    }

    if (event.event_type === 'opp_point') {
      awayPoints += 1
      awayPossession += 1
    }

    if (event.event_type === 'opp_goal') {
      awayGoals += 1
      awayPossession += 1
    }

    if (event.event_type === 'wide') {
      wides += 1
      homePossession += 1
    }

    if (event.event_type === 'short') {
      shorts += 1
      homePossession += 1
    }

    if (event.event_type === 'turnover_won') {
      homePossession += 1
    }

    if (event.event_type === 'turnover_lost') {
      awayPossession += 1
    }

    if (event.is_two_pointer) {
      twoPointers += 1
    }

    const currentHome =
      (homeGoals * 3) + homePoints

    const currentAway =
      (awayGoals * 3) + awayPoints

    momentumData.push(
      currentHome - currentAway
    )

    labels.push(index + 1)

    // EVENT FEED

    const feedItem =
      document.createElement('div')

    feedItem.className =
      'bg-[#0f172a] border border-slate-800 rounded-xl p-4'

    feedItem.innerHTML = `
      <div class="flex justify-between items-center">
        <div>
          <p class="font-semibold">
            ${getEventIcon(event.event_type)}
            ${formatEvent(event.event_type)}
          </p>

          <p class="text-sm text-slate-400">
            ${new Date(event.created_at).toLocaleTimeString()}
          </p>
        </div>
      </div>
    `

    eventFeed.prepend(feedItem)

  // SHOT MAP

const x =
  Number(event.x_coordinate)

const y =
  Number(event.y_coordinate)

console.log(
  'SHOT:',
  event.event_type,
  x,
  y
)

if (
  !isNaN(x) &&
  !isNaN(y)
) {

  // clamp values between 0-100

  const safeX =
    Math.max(0, Math.min(100, x))

  const safeY =
    Math.max(0, Math.min(100, y))

  const shot =
    document.createElement('div')

  shot.className =
    'absolute z-50 rounded-full border-2 border-white'

  shot.style.width = '16px'
  shot.style.height = '16px'

  shot.style.left =
    `${safeX}%`

  shot.style.top =
    `${safeY}%`

  shot.style.transform =
    'translate(-50%, -50%)'

  shot.style.pointerEvents =
    'none'

  // colours

  if (
    event.event_type === 'our_goal'
  ) {

    shot.style.background =
      '#10b981'

  }

  else if (
    event.event_type === 'opp_goal'
  ) {

    shot.style.background =
      '#ef4444'

  }

  else if (
    event.event_type === 'wide'
  ) {

    shot.style.background =
      '#facc15'

  }

  else if (
    event.event_type === 'short'
  ) {

    shot.style.background =
      '#64748b'

  }

  else if (
    event.event_type === 'our_point'
  ) {

    shot.style.background =
      '#ffffff'

  }

  else if (
    event.event_type === 'opp_point'
  ) {

    shot.style.background =
      '#f87171'

  }

  else {

    shot.style.background =
      '#38bdf8'

  }

  // glow for 2 pointers

  if (event.is_two_pointer) {

    shot.style.boxShadow =
      '0 0 12px rgba(251,191,36,0.9)'

  }

  shotContainer.appendChild(shot)

}

  // STATS

  const totalShots =
    homePoints +
    homeGoals +
    wides +
    shorts

  const totalScores =
    homePoints +
    homeGoals

  const conversion =
    totalShots > 0
      ? Math.round(
          (totalScores / totalShots) * 100
        )
      : 0

  document.getElementById('homeScore').innerText =
    `${homeGoals}-${homePoints}`

  document.getElementById('awayScore').innerText =
    `${awayGoals}-${awayPoints}`

  document.getElementById('shots').innerText =
    totalShots

  document.getElementById('conversion').innerText =
    `${conversion}%`

  document.getElementById('twoPointers').innerText =
    twoPointers

  // POSSESSION

  const totalPossession =
    homePossession + awayPossession

  const homePossPct =
    totalPossession > 0
      ? Math.round(
          (homePossession / totalPossession) * 100
        )
      : 50

  const awayPossPct =
    100 - homePossPct

  document.getElementById(
    'homePossessionBar'
  ).style.width =
    `${homePossPct}%`

  document.getElementById(
    'awayPossessionBar'
  ).style.width =
    `${awayPossPct}%`

  document.getElementById(
    'homePossessionLabel'
  ).innerText =
    `${document.getElementById('homeTeam').innerText} ${homePossPct}%`

  document.getElementById(
    'awayPossessionLabel'
  ).innerText =
    `${document.getElementById('awayTeam').innerText} ${awayPossPct}%`

  // MOMENTUM CHART

  const ctx =
    document.getElementById('momentumChart')

  if (momentumChart) {
    momentumChart.destroy()
  }

  momentumChart = new Chart(ctx, {

    type: 'line',

    data: {

      labels,

      datasets: [

        {

          label: 'Momentum',

          data: momentumData,

          borderColor: '#10b981',

          backgroundColor:
            'rgba(16,185,129,0.2)',

          fill: true,

          tension: 0.4,

          borderWidth: 3

        }

      ]

    },

    options: {

      responsive: true,

      maintainAspectRatio: false,

      plugins: {

        legend: {

          labels: {
            color: '#fff'
          }

        }

      },

      scales: {

        x: {

          ticks: {
            color: '#94a3b8'
          },

          grid: {
            color: '#1e293b'
          }

        },

        y: {

          ticks: {
            color: '#94a3b8'
          },

          grid: {
            color: '#1e293b'
          }

        }

      }

    }

  })

}

async function init() {

  await loadMatchSelector()
  await loadMatch()
  await loadEvents()

}

init()

client
  .channel('events-live')
  .on(
    'postgres_changes',
    {
      event: '*',
      schema: 'public',
      table: 'events'
    },
    payload => {

      if (
        payload.new.match_id === MATCH_ID
      ) {

        loadEvents()

      }

    }
  )
  .subscribe()

</script>

</body>
</html>
