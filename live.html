<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Éire Metrics LIVE
  </title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 999px;
    }

    .score-pop {
      animation: scorePop 0.45s ease;
    }

    @keyframes scorePop {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }

    }

    .event-enter {
      animation: slideFade 0.35s ease;
    }

    @keyframes slideFade {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .live-dot {
      animation: pulseDot 1.2s infinite;
    }

    @keyframes pulseDot {

      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }

      100% {
        opacity: 1;
      }

    }

  </style>

</head>

<body class="bg-[#020617] text-white">

  <div class="min-h-screen flex">

    <!-- SIDEBAR -->

    <aside class="hidden md:flex md:w-64 bg-gradient-to-br from-slate-900 to-slate-950 border-r border-slate-800 text-white p-5 flex-col gap-8">

      <div class="text-xl font-bold">
        Éire Metrics
      </div>

      <nav class="flex flex-col gap-2 text-sm font-medium">

        <a href="/index.html" class="px-3 py-2 rounded-md hover:bg-slate-800">
          Home
        </a>

        <a href="/gaa/index.html" class="px-3 py-2 rounded-md hover:bg-slate-800">
          GAA
        </a>

        <a href="/live.html" class="px-3 py-2 rounded-md bg-slate-800">
          Live Dashboard
        </a>

      </nav>

    </aside>

    <!-- MAIN -->

    <main class="flex-1 p-4 md:p-8">

      <!-- TOP -->

      <div class="sticky top-0 z-30 bg-[#020617]/80 backdrop-blur-xl border-b border-slate-800 pb-4 mb-6">

        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">

          <div>

            <div class="flex items-center gap-3">

              <h1
                id="matchTitle"
                class="text-4xl font-bold"
              >
                Loading Match...
              </h1>

              <div class="flex items-center gap-2 text-sm text-white">

                <div class="w-2 h-2 bg-red-500 rounded-full live-dot"></div>

                LIVE

              </div>

            </div>

            <p
              id="competition"
              class="text-slate-400 mt-1"
            >
              Competition
            </p>

          </div>

          <!-- SCORE -->

          <div class="grid grid-cols-2 gap-3">

            <div class="bg-slate-900 border border-slate-800 rounded-2xl px-6 py-4 text-center min-w-[140px]">

              <p
                id="homeTeam"
                class="text-slate-400 text-sm"
              >
                Home
              </p>

              <h2
                id="homeScore"
                class="text-4xl font-bold text-emerald-400"
              >
                0-00
              </h2>

            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl px-6 py-4 text-center min-w-[140px]">

              <p
                id="awayTeam"
                class="text-slate-400 text-sm"
              >
                Away
              </p>

              <h2
                id="awayScore"
                class="text-4xl font-bold text-red-400"
              >
                0-00
              </h2>

            </div>

          </div>

        </div>

      </div>

      <!-- QUICK STATS -->

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">

        <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-2xl px-4 py-3">

          <p class="text-emerald-400 text-xs uppercase">
            Match Time
          </p>

          <h3
            id="matchClock"
            class="text-2xl font-bold"
          >
            00:00
          </h3>

        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3">

          <p class="text-slate-400 text-xs uppercase">
            Score Difference
          </p>

          <h3
            id="scoreDiff"
            class="text-2xl font-bold"
          >
            0
          </h3>

        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3">

          <p class="text-slate-400 text-xs uppercase">
            Latest Event
          </p>

          <h3
            id="latestEvent"
            class="text-lg font-semibold"
          >
            —
          </h3>

        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3">

          <p class="text-slate-400 text-xs uppercase">
            Momentum
          </p>

          <h3
            id="momentumState"
            class="text-2xl font-bold text-emerald-400"
          >
            EVEN
          </h3>

        </div>

      </div>

      <!-- MAIN GRID -->

      <div class="grid grid-cols-1 xl:grid-cols-[1fr_420px] gap-6">

        <!-- LEFT -->

        <div class="space-y-6">

          <!-- STATS -->

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">

              <p class="text-slate-400 text-sm">
                Shots
              </p>

              <h2 id="shots" class="text-3xl font-bold">
                0
              </h2>

            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">

              <p class="text-slate-400 text-sm">
                Conversion
              </p>

              <h2 id="conversion" class="text-3xl font-bold">
                0%
              </h2>

            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">

              <p class="text-slate-400 text-sm">
                2PT
              </p>

              <h2 id="twoPointers" class="text-3xl font-bold">
                0
              </h2>

            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">

              <p class="text-slate-400 text-sm">
                Possession
              </p>

              <h2 id="homePossession" class="text-3xl font-bold text-emerald-400">
                50%
              </h2>

            </div>

          </div>

          <!-- MOMENTUM -->

          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

            <h2 class="text-2xl font-bold mb-5">
              Live Momentum
            </h2>

            <div class="h-[320px]">

              <canvas id="momentumChart"></canvas>

            </div>

          </div>

          <!-- EVENT FEED -->

          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

            <div class="flex items-center justify-between mb-5">

              <h2 class="text-2xl font-bold">
                Event Feed
              </h2>

              <span class="text-slate-400 text-sm">
                Live Updates
              </span>

            </div>

            <div
              id="eventFeed"
              class="space-y-3 max-h-[500px] overflow-y-auto"
            ></div>

          </div>

        </div>

        <!-- RIGHT -->

        <div class="space-y-6">

          <!-- POSSESSION -->

          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

            <div class="flex justify-between mb-4">

              <div>

                <p class="text-slate-400 text-sm">
                  Home
                </p>

                <h2 class="text-4xl font-bold text-emerald-400">

                  <span id="homePossessionLarge">
                    50
                  </span>%

                </h2>

              </div>

              <div class="text-right">

                <p class="text-slate-400 text-sm">
                  Away
                </p>

                <h2 class="text-4xl font-bold text-red-400">

                  <span id="awayPossession">
                    50
                  </span>%

                </h2>

              </div>

            </div>

            <div class="w-full h-6 bg-slate-800 rounded-full overflow-hidden flex">

              <div
                id="homeBar"
                class="bg-emerald-500 transition-all duration-500"
                style="width:50%"
              ></div>

              <div
                id="awayBar"
                class="bg-red-500 transition-all duration-500"
                style="width:50%"
              ></div>

            </div>

          </div>

          <!-- SHOT MAP -->

          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

            <h2 class="text-2xl font-bold mb-5">
              Shot Map
            </h2>

            <div class="relative">

              <img
                src="shotmap.png"
                class="rounded-2xl w-full"
              />

              <div
                id="shotContainer"
                class="absolute inset-0"
              ></div>

            </div>

          </div>

        </div>

      </div>

    </main>

  </div>

<script>

const supabaseUrl =
  'https://nftqvzvzlstfjbanqprp.supabase.co'

const supabaseKey =
  'sb_publishable_omwQ3vjOsAsLgSaTrMGGhQ_vE9qnU6r'

const client =
  supabase.createClient(
    supabaseUrl,
    supabaseKey
  )

// URL PARAMS

const params =
  new URLSearchParams(window.location.search)

let MATCH_ID =
  parseInt(params.get('id'))

console.log('INITIAL MATCH ID:', MATCH_ID)

let momentumChart
let matchClockInterval = null

// LABELS

function formatEvent(type) {

  const labels = {

    our_point: 'Point Scored',
    our_goal: 'Goal Scored',
    opp_point: 'Opposition Point',
    opp_goal: 'Opposition Goal',
    wide: 'Wide',
    short: 'Short',
    possession_won: 'Possession Won',
    possession_lost: 'Possession Lost'

  }

  return labels[type] || type

}

// ICONS

function getEventIcon(type) {

  const icons = {

    our_goal: '🥅',
    our_point: '⚪',
    opp_goal: '🔴',
    opp_point: '🟥',
    wide: '❌',
    short: '⬛',
    possession_won: '🟢',
    possession_lost: '🔄'

  }

  return icons[type] || '•'

}

// LOAD MATCH

async function loadMatch() {

  let query =
    client
      .from('matches')
      .select('*')

  // LOAD SPECIFIC MATCH

  if (MATCH_ID) {

    query =
      query.eq('id', MATCH_ID)

  }

  // LOAD MOST RECENT MATCH

  else {

    query =
      query
        .order('id', { ascending: false })
        .limit(1)

  }

  const { data, error } =
    await query.single()

  console.log('MATCH:', data)
  console.log('MATCH ERROR:', error)

  if (!data) return

  // IMPORTANT

  MATCH_ID = data.id

  console.log('ACTIVE MATCH ID:', MATCH_ID)

  // HEADER

  document.getElementById('matchTitle').innerText =
    `${data.team_name} vs ${data.opponent}`

  document.getElementById('homeTeam').innerText =
    data.team_name

  document.getElementById('awayTeam').innerText =
    data.opponent

  document.getElementById('competition').innerText =
    data.competition

  // LIVE CLOCK

  if (matchClockInterval) {
    clearInterval(matchClockInterval)
  }

  if (data.match_start_time) {

    matchClockInterval =
      setInterval(() => {

        const startTime =
          new Date(data.match_start_time)

        const now =
          new Date()

        const diff =
          Math.floor(
            (now - startTime) / 1000
          )

        const minutes =
          String(
            Math.floor(diff / 60)
          ).padStart(2, '0')

        const seconds =
          String(
            diff % 60
          ).padStart(2, '0')

        document.getElementById('matchClock').innerText =
          `${minutes}:${seconds}`

      }, 1000)

  }

}

// LOAD EVENTS

async function loadEvents() {

  if (!MATCH_ID) return

  const { data, error } =
    await client
      .from('events')
      .select('*')
      .eq('match_id', MATCH_ID)
      .order('created_at', {
        ascending: true
      })

  console.log('EVENTS:', data)
  console.log('EVENTS ERROR:', error)

  const eventFeed =
    document.getElementById('eventFeed')

  const shotContainer =
    document.getElementById('shotContainer')

  eventFeed.innerHTML = ''
  shotContainer.innerHTML = ''

  // EMPTY STATE

  if (!data || data.length === 0) {

    eventFeed.innerHTML = `

      <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-6 text-center text-slate-400">
        No live events tracked yet.
      </div>

    `

    return

  }

  // STATS

  let homePoints = 0
  let homeGoals = 0

  let awayPoints = 0
  let awayGoals = 0

  let wides = 0
  let shorts = 0

  let twoPointers = 0

  let homePossessionEvents = 0
  let awayPossessionEvents = 0

  let momentumData = []
  let labels = []

  // LOOP EVENTS

  data.forEach((event, index) => {

    // HOME

    if (event.event_type === 'our_point') {
      homePoints += event.is_two_pointer ? 2 : 1
    }

    if (event.event_type === 'our_goal') {
      homeGoals += 1
    }

    // AWAY

    if (event.event_type === 'opp_point') {
      awayPoints += 1
    }

    if (event.event_type === 'opp_goal') {
      awayGoals += 1
    }

    // MISSES

    if (event.event_type === 'wide') {
      wides += 1
    }

    if (event.event_type === 'short') {
      shorts += 1
    }

    // 2 POINTERS

    if (event.is_two_pointer) {
      twoPointers += 1
    }

    // POSSESSION

    if (event.event_type === 'possession_won') {
      homePossessionEvents += 1
    }

    if (event.event_type === 'possession_lost') {
      awayPossessionEvents += 1
    }

    // MOMENTUM

    const currentHome =
      (homeGoals * 3) + homePoints

    const currentAway =
      (awayGoals * 3) + awayPoints

    momentumData.push(
      currentHome - currentAway
    )

    labels.push(index + 1)

    // EVENT FEED ITEM

    const feedItem =
      document.createElement('div')

    feedItem.className =
      'bg-[#0f172a] border border-slate-800 rounded-xl p-4 flex justify-between items-center event-enter'

    feedItem.innerHTML = `

      <div>

        <p class="font-semibold text-white">
          ${getEventIcon(event.event_type)}
          ${formatEvent(event.event_type)}
        </p>

        <p class="text-slate-400 text-sm">
          ${new Date(event.created_at).toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          })}
        </p>

      </div>

    `

    eventFeed.appendChild(feedItem)

    // SHOT MAP

    if (
      event.x_location !== null &&
      event.y_location !== null
    ) {

      const dot =
        document.createElement('div')

      dot.className =
        'absolute rounded-full border-2 border-white'

      let size = 16
      let color = '#22c55e'

      // GOAL

      if (event.event_type === 'our_goal') {

        size = 24
        color = '#3b82f6'

      }

      // WIDE

      if (event.event_type === 'wide') {
        color = '#ef4444'
      }

      // SHORT

      if (event.event_type === 'short') {
        color = '#94a3b8'
      }

      // 2 POINTER

      if (event.is_two_pointer) {

        size = 20
        color = '#eab308'

      }

      dot.style.width =
        `${size}px`

      dot.style.height =
        `${size}px`

      dot.style.background =
        color

      dot.style.left =
        `${event.x_location - (size / 2)}px`

      dot.style.top =
        `${event.y_location - (size / 2)}px`

      shotContainer.appendChild(dot)

    }

  })

  // TOTALS

  const homeTotal =
    (homeGoals * 3) + homePoints

  const awayTotal =
    (awayGoals * 3) + awayPoints

  const totalShots =
    homePoints +
    homeGoals +
    wides +
    shorts

  const totalScores =
    homePoints +
    homeGoals

  const conversion =
    totalShots > 0
      ? Math.round(
          (totalScores / totalShots) * 100
        )
      : 0

  // POSSESSION %

  const totalPossessionEvents =
    homePossessionEvents +
    awayPossessionEvents

  let homePossession = 50
  let awayPossession = 50

  if (totalPossessionEvents > 0) {

    homePossession =
      Math.round(
        (
          homePossessionEvents /
          totalPossessionEvents
        ) * 100
      )

    awayPossession =
      100 - homePossession

  }

  // UPDATE UI

  document.getElementById('homeScore').innerText =
    `${homeGoals}-${homePoints}`

  document.getElementById('awayScore').innerText =
    `${awayGoals}-${awayPoints}`

  document.getElementById('shots').innerText =
    totalShots

  document.getElementById('conversion').innerText =
    `${conversion}%`

  document.getElementById('twoPointers').innerText =
    twoPointers

  document.getElementById('scoreDiff').innerText =
    homeTotal - awayTotal

  document.getElementById('latestEvent').innerText =
    formatEvent(
      data[data.length - 1].event_type
    )

  document.getElementById('homePossession').innerText =
    `${homePossession}%`

  document.getElementById('homePossessionLarge').innerText =
    homePossession

  document.getElementById('awayPossession').innerText =
    awayPossession

  document.getElementById('homeBar').style.width =
    `${homePossession}%`

  document.getElementById('awayBar').style.width =
    `${awayPossession}%`

  // MOMENTUM STATE

  const diff =
    homeTotal - awayTotal

  if (diff > 0) {

    document.getElementById('momentumState').innerText =
      'HOME'

  }

  else if (diff < 0) {

    document.getElementById('momentumState').innerText =
      'AWAY'

  }

  else {

    document.getElementById('momentumState').innerText =
      'EVEN'

  }

  // CHART

  const ctx =
    document.getElementById('momentumChart')

  if (momentumChart) {
    momentumChart.destroy()
  }

  momentumChart = new Chart(ctx, {

    type: 'line',

    data: {

      labels,

      datasets: [

        {

          label:
            'Score Differential',

          data:
            momentumData,

          borderColor:
            '#10b981',

          backgroundColor:
            'rgba(16,185,129,0.2)',

          fill: true,

          tension: 0.4,

          borderWidth: 3

        }

      ]

    },

    options: {

      maintainAspectRatio: false,

      responsive: true,

      plugins: {

        legend: {

          labels: {
            color: '#ffffff'
          }

        }

      },

      scales: {

        x: {

          ticks: {
            color: '#94a3b8'
          },

          grid: {
            color: '#1e293b'
          }

        },

        y: {

          ticks: {
            color: '#94a3b8'
          },

          grid: {
            color: '#1e293b'
          }

        }

      }

    }

  })

}

// INIT

async function init() {

  await loadMatch()

  await loadEvents()

}

init()

// REALTIME

client
  .channel('events-live')
  .on(
    'postgres_changes',
    {
      event: '*',
      schema: 'public',
      table: 'events'
    },
    payload => {

      console.log('REALTIME:', payload)

      // ONLY REFRESH CURRENT MATCH

      if (
        payload.new.match_id === MATCH_ID
      ) {

        loadEvents()

      }

    }
  )
  .subscribe()

</script>

</body>
</html>
