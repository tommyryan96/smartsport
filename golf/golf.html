<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Golf Predictions – Éire Metrics</title>

  <meta name="description"
        content="Masters predictions, player rankings and golf analytics from Éire Metrics." />

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900">

<!-- MOBILE TOP BAR -->
<div class="md:hidden flex items-center justify-between px-4 py-3 bg-slate-900 text-white">
  <span class="font-semibold text-lg">Éire Metrics</span>
  <button id="menu-btn" class="text-2xl">☰</button>
</div>

<!-- MOBILE MENU -->
<div id="mobile-menu"
     class="fixed top-0 left-0 w-64 h-full bg-slate-900 text-white p-6 transform -translate-x-full transition-transform duration-300 z-50">
  <button id="close-menu" class="mb-6 text-xl">✕</button>
  <nav class="flex flex-col gap-3">
    <a href="/index.html">Home</a>
    <a href="/gaa/index.html">GAA</a>
    <a href="/soccer/ireland/index.html">Soccer</a>
    <a href="/golf/" class="text-green-400">Golf</a>
    <a href="/blog/index.html">Blog</a>
  </nav>
</div>

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="hidden md:flex md:w-64 bg-slate-900 text-white p-5 flex-col gap-8">
    <div class="text-xl font-bold">Éire Metrics</div>

    <nav class="flex flex-col gap-2 text-sm">
      <a href="/index.html">Home</a>
      <a href="/gaa/index.html">GAA</a>
      <a href="/soccer/ireland/index.html">Soccer</a>
      <a href="/golf/" class="bg-slate-800 px-3 py-2 rounded-md">Golf</a>
      <a href="/blog/index.html">Blog</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 px-4 sm:px-6 md:px-10 lg:px-16 py-8 space-y-12">

    <!-- HERO -->
    <section class="max-w-3xl space-y-6">
      <span class="inline-flex items-center rounded-full bg-green-100 px-3 py-1
                   text-xs font-semibold text-green-700">
        Masters Prediction Model
      </span>

      <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight">
        Predicted finishing positions
      </h1>

      <p class="text-slate-600 text-lg max-w-xl">
        Model-based rankings using simulated performance outputs.
      </p>
    </section>

    <!-- MODEL PICKS -->
    <section id="model-picks" class="grid md:grid-cols-3 gap-6"></section>

    <!-- TABLE -->
    <section>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

        <div class="px-4 py-3 border-b border-slate-200 font-semibold">
          Full prediction table
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">

            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="px-4 py-3 text-left">#</th>
                <th class="px-4 py-3 text-left">Player</th>
                <th class="px-4 py-3 text-left">Expected Finish</th>
              </tr>
            </thead>

            <tbody id="prediction-table" class="divide-y"></tbody>

          </table>
        </div>

      </div>
    </section>

  </main>
</div>

<script>
async function loadPredictions() {
  const res = await fetch('../data/masters_matrix.csv');
  const text = await res.text();

  const rows = text.trim().split(/\r?\n/).map(r => r.split(','));
  const data = rows.slice(1);

  const players = data.map(row => {
    const name = row[0];
    const values = row.slice(1).map(v => parseFloat(v));

    let bestValue = -Infinity;
    let bestPosition = 0;

    values.forEach((v, i) => {
      if (v > bestValue) {
        bestValue = v;
        bestPosition = i + 1;
      }
    });

    return {
      name,
      bestPosition,
      strength: bestValue
    };
  });

  // SORT → real predicted leaderboard
  players.sort((a, b) => {
    if (a.bestPosition !== b.bestPosition) {
      return a.bestPosition - b.bestPosition;
    }
    return b.strength - a.strength;
  });

  const table = document.getElementById('prediction-table');
  table.innerHTML = "";

  players.forEach((p, i) => {
    const row = document.createElement('tr');

    row.innerHTML = `
      <td class="px-4 py-3 font-semibold">${i+1}</td>
      <td class="px-4 py-3">${p.name}</td>
      <td class="px-4 py-3">${p.bestPosition}</td>
    `;

    table.appendChild(row);
  });
}

loadPredictions();
</script>

</body>
</html>
