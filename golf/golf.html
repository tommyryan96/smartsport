<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Golf Predictions – Éire Metrics</title>

  <meta name="description"
        content="Masters predictions, player rankings and golf analytics from Éire Metrics." />

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900">

<!-- MOBILE TOP BAR -->
<div class="md:hidden flex items-center justify-between px-4 py-3 bg-slate-900 text-white">
  <span class="font-semibold text-lg">Éire Metrics</span>
  <button id="menu-btn" class="text-2xl">☰</button>
</div>

<!-- MOBILE MENU -->
<div id="mobile-menu"
     class="fixed top-0 left-0 w-64 h-full bg-slate-900 text-white p-6 transform -translate-x-full transition-transform duration-300 z-50">
  <button id="close-menu" class="mb-6 text-xl">✕</button>
  <nav class="flex flex-col gap-3">
    <a href="/index.html">Home</a>
    <a href="/gaa/index.html">GAA</a>
    <a href="/soccer/ireland/index.html">Soccer</a>
    <a href="/golf/" class="text-green-400">Golf</a>
    <a href="/blog/index.html">Blog</a>
  </nav>
</div>

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="hidden md:flex md:w-64 bg-slate-900 text-white p-5 flex-col gap-8">
    <div class="text-xl font-bold">Éire Metrics</div>

    <nav class="flex flex-col gap-2 text-sm">
      <a href="/index.html">Home</a>
      <a href="/gaa/index.html">GAA</a>
      <a href="/soccer/ireland/index.html">Soccer</a>
      <a href="/golf/" class="bg-slate-800 px-3 py-2 rounded-md">Golf</a>
      <a href="/blog/index.html">Blog</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 px-4 sm:px-6 md:px-10 lg:px-16 py-8 space-y-12">

    <!-- HERO -->
    <section class="max-w-3xl space-y-6">
      <span class="inline-flex items-center rounded-full bg-green-100 px-3 py-1
                   text-xs font-semibold text-green-700">
        Masters Prediction Model
      </span>

      <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight">
        Predicted finishing positions
      </h1>

      <p class="text-slate-600 text-lg max-w-xl">
        Model-based rankings using simulated performance outputs.
      </p>
    </section>

    <!-- MODEL PICKS -->
    <section id="model-picks" class="grid md:grid-cols-3 gap-6"></section>

    <!-- TABLE -->
    <section>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

        <div class="px-4 py-3 border-b border-slate-200 font-semibold">
          Full prediction table
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">

            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="px-4 py-3 text-left">#</th>
                <th class="px-4 py-3 text-left">Player</th>
                <th class="px-4 py-3 text-left">Avg Score</th>
                <th class="px-4 py-3 text-left">Best Case</th>
                <th class="px-4 py-3 text-left">Volatility</th>
              </tr>
            </thead>

            <tbody id="prediction-table" class="divide-y"></tbody>

          </table>
        </div>

      </div>
    </section>

  </main>
</div>

<script>
async function loadPredictions() {
  try {
    const res = await fetch('../data/masters_matrix.csv');
    if (!res.ok) throw new Error("CSV not found");

    const text = await res.text();

    const rows = text.trim().split(/\r?\n/).map(r => r.split(','));
    const headers = rows[0];
    const data = rows.slice(1);

    // Build player objects
    let players = data.map(row => ({
      name: row[0],
      values: row.slice(1).map(v => parseFloat(v))
    }));

    const predicted = [];

    // LOOP POSITIONS (columns)
    for (let pos = 0; pos < headers.length - 1; pos++) {

      let bestPlayer = null;
      let bestValue = -Infinity;
      let bestIndex = -1;

      players.forEach((p, i) => {
        const val = p.values[pos];

        if (val > bestValue) { // higher = better
          bestValue = val;
          bestPlayer = p;
          bestIndex = i;
        }
      });

      if (bestPlayer) {
        predicted.push({
          position: pos + 1,
          name: bestPlayer.name,
          score: bestValue
        });

        // REMOVE PLAYER (important!)
        players.splice(bestIndex, 1);
      }
    }

    const table = document.getElementById('prediction-table');
    const picks = document.getElementById('model-picks');

    table.innerHTML = "";

    // PICKS
    const winner = predicted[0];
    const sleeper = predicted[9]; // 10th
    const fade = predicted[predicted.length - 1];

    picks.innerHTML = `
      <div class="bg-white p-5 rounded-xl border shadow-sm">
        <div class="text-green-600 text-sm font-medium">🏆 Predicted Winner</div>
        <div class="text-lg font-semibold">${winner.name}</div>
      </div>

      <div class="bg-white p-5 rounded-xl border shadow-sm">
        <div class="text-yellow-600 text-sm font-medium">🎯 Top 10 Edge</div>
        <div class="text-lg font-semibold">${sleeper?.name || "-"}</div>
      </div>

      <div class="bg-white p-5 rounded-xl border shadow-sm">
        <div class="text-red-600 text-sm font-medium">⚠️ Bottom Finish</div>
        <div class="text-lg font-semibold">${fade.name}</div>
      </div>
    `;

    // BUILD TABLE
    predicted.forEach(p => {
      const row = document.createElement('tr');

      let bg = "";
      if (p.position <= 5) bg = "bg-green-50";
      else if (p.position <= 10) bg = "bg-yellow-50";

      row.className = bg;

      row.innerHTML = `
        <td class="px-4 py-3 font-semibold">${p.position}</td>
        <td class="px-4 py-3 font-medium">${p.name}</td>
        <td class="px-4 py-3 text-slate-500">${p.score.toFixed(2)}</td>
      `;

      table.appendChild(row);
    });

  } catch (err) {
    console.error(err);
    document.getElementById('prediction-table').innerHTML =
      '<tr><td class="p-4 text-red-500">Error loading data</td></tr>';
  }
}

loadPredictions();
</script>

</body>
</html>
