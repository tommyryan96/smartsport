<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R6NQVSRXEE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R6NQVSRXEE');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>GAA Analytics Dashboard | Éire Metrics</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 🔥 CRITICAL FIX -->
  <style>
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-white p-5 flex flex-col gap-8 shadow-xl">

      <div class="flex items-center gap-4">
        <img src="/assets/eiremetrics-logo.png" class="h-14" />
        <div>
          <div class="text-lg font-bold">Éire Metrics</div>
          <div class="text-xs text-slate-400">Irish sports analytics</div>
        </div>
      </div>

      <nav class="flex flex-col gap-2 text-sm font-medium">
        <a href="/index.html" class="px-3 py-2 rounded-md hover:bg-slate-800">Home</a>
        <a href="/about.html" class="px-3 py-2 rounded-md hover:bg-slate-800">About</a>
        <a href="/clubs.html" class="px-3 py-2 rounded-md hover:bg-slate-800">For Clubs</a>
        <a href="/gaa/index.html" class="px-3 py-2 rounded-md bg-slate-800">GAA</a>
        <a href="/soccer/ireland/index.html" class="px-3 py-2 rounded-md hover:bg-slate-800">Soccer</a>
        <a href="/blog/index.html" class="px-3 py-2 rounded-md hover:bg-slate-800">Blog</a>
      </nav>

    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-10 space-y-8">

      <!-- HEADER -->
      <div>
        <h1 class="text-3xl font-bold">GAA Analytics Dashboard</h1>
        <p class="text-slate-600">Shot maps, trends and team comparison tools</p>
      </div>

      <!-- TABS -->
      <div class="flex gap-2 border-b pb-2">
        <button class="tab-btn active px-4 py-2 rounded-md bg-slate-900 text-white" data-tab="overview">Overview</button>
        <button class="tab-btn px-4 py-2 rounded-md hover:bg-slate-200" data-tab="shotmap">Shot Map</button>
        <button class="tab-btn px-4 py-2 rounded-md hover:bg-slate-200" data-tab="comparison">Comparison</button>
        <button class="tab-btn px-4 py-2 rounded-md hover:bg-slate-200" data-tab="trends">Trends</button>
      </div>

      <!-- OVERVIEW -->
      <section id="tab-overview" class="tab-section active space-y-6">

        <!-- KPIs -->
        <div class="grid md:grid-cols-3 gap-6">
          <div class="bg-white p-6 rounded-xl shadow border">
            <h3 class="text-sm text-slate-500">Total Games</h3>
            <p id="kpi-total-games" class="text-3xl font-bold mt-2">–</p>
          </div>

          <div class="bg-white p-6 rounded-xl shadow border">
            <h3 class="text-sm text-slate-500">Avg Points</h3>
            <p id="kpi-avg-points" class="text-3xl font-bold mt-2">–</p>
          </div>

          <div class="bg-white p-6 rounded-xl shadow border">
            <h3 class="text-sm text-slate-500">Top Team</h3>
            <p id="kpi-top-team" class="text-3xl font-bold mt-2">–</p>
          </div>
        </div>

        <!-- CHARTS -->
        <div class="grid md:grid-cols-2 gap-6">

          <div class="bg-white p-6 rounded-xl shadow border">
            <div class="relative w-full h-[300px]">
              <canvas id="overview-top-teams"></canvas>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow border">
            <div class="relative w-full h-[300px]">
              <canvas id="overview-defence"></canvas>
            </div>
          </div>

        </div>

      </section>

      <!-- SHOT MAP -->
      <section id="tab-shotmap" class="tab-section hidden">
        <div class="bg-white p-6 rounded-xl shadow border space-y-4">

          <h3 class="text-lg font-semibold">Shot Map</h3>

          <div class="relative w-full h-[420px] bg-gradient-to-b from-emerald-800 to-emerald-900 rounded-xl overflow-hidden">

  <!-- Outer border -->
  <div class="absolute inset-0 border border-white/20 rounded-xl"></div>

  <!-- Halfway line -->
  <div class="absolute top-1/2 left-0 right-0 border-t border-white/20"></div>

  <!-- Center circle -->
  <div class="absolute top-1/2 left-1/2 w-24 h-24 border border-white/20 rounded-full -translate-x-1/2 -translate-y-1/2"></div>

  <!-- 🔥 TOP GOAL -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2">
    <div class="w-24 h-6 border border-white/30"></div>
  </div>

  <!-- 🔥 BOTTOM GOAL -->
  <div class="absolute bottom-0 left-1/2 -translate-x-1/2">
    <div class="w-24 h-6 border border-white/30"></div>
  </div>

  <!-- 🔥 SMALL GOAL AREAS (adds realism) -->
  <div class="absolute top-0 left-1/2 w-40 h-16 border border-white/10 -translate-x-1/2"></div>
  <div class="absolute bottom-0 left-1/2 w-40 h-16 border border-white/10 -translate-x-1/2"></div>

  <!-- Shot layer -->
  <div id="shotmap-layer" class="absolute inset-0"></div>

</div>

          <div class="flex gap-6 text-sm">
            <span class="flex items-center gap-2"><span class="w-3 h-3 bg-green-500 rounded-full"></span>Goal</span>
            <span class="flex items-center gap-2"><span class="w-3 h-3 bg-emerald-400 rounded-full"></span>Point</span>
            <span class="flex items-center gap-2"><span class="w-3 h-3 bg-red-500 rounded-full"></span>Miss</span>
          </div>

        </div>
      </section>

      <!-- COMPARISON -->
      <section id="tab-comparison" class="tab-section hidden">
        <div class="bg-white p-6 rounded-xl shadow border">

          <h3 class="mb-4 font-semibold">Team Comparison</h3>

 <div class="relative w-full h-[420px] flex items-center justify-center">
  <div class="w-[450px] h-[380px]">
    <canvas id="comparison-chart"></canvas>
  </div>
</div>

        </div>
      </section>

      <!-- TRENDS -->
      <section id="tab-trends" class="tab-section hidden">
        <div class="bg-white p-6 rounded-xl shadow border">

          <h3 class="mb-4 font-semibold">Trends</h3>

          <div class="relative w-full h-[320px]">
            <canvas id="trends-chart"></canvas>
          </div>

          <p class="text-sm text-slate-600 mt-3">
            Scoring output has gradually declined over recent rounds.
          </p>

        </div>
      </section>

    </main>
  </div>

  <!-- SCRIPTS -->
  <script src="overview.js"></script>
  <script src="shotmap.js"></script>
  <script src="comparison.js"></script>
  <script src="trends.js"></script>

  <script>
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;

        document.querySelectorAll('.tab-btn').forEach(b =>
          b.classList.remove('bg-slate-900','text-white')
        );

        btn.classList.add('bg-slate-900','text-white');

        document.querySelectorAll('.tab-section').forEach(sec =>
          sec.classList.add('hidden')
        );

        document.getElementById('tab-' + tab).classList.remove('hidden');
      });
    });
  </script>

</body>
</html>
