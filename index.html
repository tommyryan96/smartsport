<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Golf Predictions – Éire Metrics</title>

  <meta name="description"
        content="Masters predictions, player rankings and golf analytics from Éire Metrics." />

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0B1220] text-white">

<!-- MOBILE TOP BAR -->
<div class="md:hidden flex items-center justify-between px-4 py-3 bg-[#0B1220] border-b border-slate-800">
  <span class="font-semibold text-lg">Éire Metrics</span>
  <button id="menu-btn" class="text-2xl">☰</button>
</div>

<!-- MOBILE MENU -->
<div id="mobile-menu"
     class="fixed top-0 left-0 w-64 h-full bg-[#0B1220] p-6 transform -translate-x-full transition-transform duration-300 z-50 border-r border-slate-800">

  <button id="close-menu" class="mb-6 text-xl">✕</button>

  <nav class="flex flex-col gap-3 text-sm">
    <a href="/index.html">Home</a>
    <a href="/gaa/index.html">GAA</a>
    <a href="/soccer/ireland/index.html">Soccer</a>
    <a href="/golf/golf.html" class="text-green-400">Golf</a>
    <a href="/blog/index.html">Blog</a>
  </nav>
</div>

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="hidden md:flex md:w-64 bg-[#0B1220] border-r border-slate-800 p-6 flex-col gap-8">

    <div class="text-xl font-bold">Éire Metrics</div>

    <nav class="flex flex-col gap-2 text-sm">
      <a href="/index.html">Home</a>
      <a href="/gaa/index.html">GAA</a>
      <a href="/soccer/ireland/index.html">Soccer</a>
      <a href="/golf/index.html" class="text-green-400">Golf</a>
      <a href="/blog/index.html">Blog</a>
    </nav>

  </aside>

  <!-- MAIN -->
  <main class="flex-1 px-4 sm:px-6 md:px-10 lg:px-16 py-8 space-y-10">

    <!-- HERO -->
    <section class="space-y-4 max-w-3xl">
      <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-xs">
        Masters Prediction Model
      </span>

      <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold">
        Predicted Finishing Positions
      </h1>

      <p class="text-slate-400 text-lg">
        Model-based rankings using simulated outcomes and probability distributions.
      </p>
    </section>

    <!-- MODEL PICKS -->
    <section id="model-picks" class="grid md:grid-cols-3 gap-4"></section>

    <!-- TABLE -->
    <section>

      <div class="bg-[#111827] rounded-xl border border-slate-800 overflow-hidden">

        <div class="px-4 py-3 border-b border-slate-800 font-semibold">
          Full Prediction Table
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">

            <thead class="text-slate-400 border-b border-slate-800">
              <tr>
                <th class="px-4 py-3 text-left">#</th>
                <th class="px-4 py-3 text-left">Player</th>
                <th class="px-4 py-3 text-left">Exp Finish</th>
                <th class="px-4 py-3 text-left">Win %</th>
                <th class="px-4 py-3 text-left">Top 5</th>
                <th class="px-4 py-3 text-left">Top 10</th>
              </tr>
            </thead>

            <tbody id="prediction-table"></tbody>

          </table>
        </div>

      </div>

    </section>

  </main>
</div>

<!-- SCRIPT -->
<script>
async function loadPredictions() {
  const res = await fetch('/data/masters_matrix.csv');
  const text = await res.text();

  const rows = text.trim().split('\\n').map(r => r.split(','));
  const data = rows.slice(1);

  const players = data.map(row => {
    const name = row[0];
    const probs = row.slice(1).map(Number);

    let exp = 0, total = 0;

    probs.forEach((p, i) => {
      exp += p * (i + 1);
      total += p;
    });

    exp = exp / total;

    const win = probs[0];
    const top5 = probs.slice(0, 5).reduce((a,b)=>a+b,0);
    const top10 = probs.slice(0, 10).reduce((a,b)=>a+b,0);

    return { name, exp, win, top5, top10 };
  });

  players.sort((a,b)=>a.exp-b.exp);

  const table = document.getElementById('prediction-table');
  const picks = document.getElementById('model-picks');

  // MODEL PICKS
  const winner = players[0];
  const sleeper = players.find(p => p.exp > 10 && p.exp < 20);
  const fade = players[players.length - 1];

  picks.innerHTML = `
    <div class="bg-[#111827] p-4 rounded-xl border border-slate-800">
      <div class="text-green-400 text-sm">🏆 Model Winner</div>
      <div class="text-lg font-semibold">${winner.name}</div>
      <div class="text-slate-400 text-sm">Win ${(winner.win).toFixed(1)}%</div>
    </div>

    <div class="bg-[#111827] p-4 rounded-xl border border-slate-800">
      <div class="text-yellow-400 text-sm">🎯 Sleeper</div>
      <div class="text-lg font-semibold">${sleeper?.name || "-"}</div>
    </div>

    <div class="bg-[#111827] p-4 rounded-xl border border-slate-800">
      <div class="text-red-400 text-sm">⚠️ Fade</div>
      <div class="text-lg font-semibold">${fade.name}</div>
    </div>
  `;

  players.forEach((p, i) => {

    let rowColor = "border-b border-slate-800";

    if (i < 5) rowColor += " bg-green-500/5";
    else if (i < 10) rowColor += " bg-yellow-500/5";

    const row = document.createElement('tr');

    row.className = rowColor + " hover:bg-slate-800 transition";

    row.innerHTML = `
      <td class="px-4 py-3 font-semibold">${i+1}</td>
      <td class="px-4 py-3">${p.name}</td>
      <td class="px-4 py-3">${p.exp.toFixed(1)}</td>
      <td class="px-4 py-3">${p.win.toFixed(1)}%</td>
      <td class="px-4 py-3">${p.top5.toFixed(1)}%</td>
      <td class="px-4 py-3">${p.top10.toFixed(1)}%</td>
    `;

    table.appendChild(row);
  });
}

loadPredictions();

// MENU
const menu = document.getElementById("mobile-menu");
const openBtn = document.getElementById("menu-btn");
const closeBtn = document.getElementById("close-menu");

openBtn.addEventListener("click", () => {
  menu.classList.remove("-translate-x-full");
});

closeBtn.addEventListener("click", () => {
  menu.classList.add("-translate-x-full");
});
</script>

</body>
</html>
